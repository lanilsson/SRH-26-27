<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elliptic Graph 3D</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --surface-2: #f1f0ec; --border: #d9d8d2;
    --text-primary: #0b0b0b; --text-secondary: #52514e;
    --illicit: #eb6834; --licit: #2a78d6; --unknown: #8a8983;
    --edge: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --surface-2: #242423; --border: #3a3a38;
      --text-primary: #ffffff; --text-secondary: #c3c2b7;
      --illicit: #d95926; --licit: #3987e5; --unknown: #8f8e88;
      --edge: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #242423; --border: #3a3a38;
    --text-primary: #ffffff; --text-secondary: #c3c2b7;
    --illicit: #d95926; --licit: #3987e5; --unknown: #8f8e88;
    --edge: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface-1); color: var(--text-primary);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); z-index: 1; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary); }
  .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .swatch.illicit { background: var(--illicit); } .swatch.licit { background: var(--licit); }
  .swatch.unknown { background: var(--unknown); }
  input[type=text] { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-1); color: var(--text-primary); width: 150px; }
  button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
  .hint { color: var(--text-secondary); font-size: 12px; margin-left: auto; }
  main { flex: 1; position: relative; min-height: 0; }
  #g { position: absolute; inset: 0; }
  #status { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-2); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .scene-tooltip { font-size: 12px !important; background: var(--surface-2); color: var(--text-primary);
    padding: 6px 9px; border-radius: 6px; border: 1px solid var(--border); }
  @media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Elliptic tiny graph · 3D</h1>
  <div class="legend" id="legend"></div>
  <input type="text" id="search" placeholder="find txId…">
  <button id="spin">Auto-rotate</button>
  <button id="reset">Reset view</button>
  <span class="hint">left-drag to rotate · right-drag to pan · scroll to zoom · click a node to fly to it</span>
</header>
<main>
  <div id="g"></div>
  <div id="status"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<script>
const GRAPH = /*__GRAPH_JSON__*/;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const color = { illicit: css('--illicit'), licit: css('--licit'), unknown: css('--unknown') };

const nodes = GRAPH.nodes.map(n => ({ ...n, val: n.cls === 'illicit' ? 6 : 1 + (n.in + n.out) * 0.6 }));
const links = GRAPH.links.map(l => ({ source: l.s, target: l.t }));
const byTx = new Map(nodes.map(n => [n.tx, n]));
const byId = new Map(nodes.map(n => [n.id, n]));
// link endpoints are plain ids until the layout engine swaps them for node objects
const end = v => (typeof v === 'object' ? v : byId.get(v));
const neighbours = new Map(nodes.map(n => [n.id, new Set([n.id])]));
for (const l of links) { neighbours.get(l.source).add(l.target); neighbours.get(l.target).add(l.source); }

const visible = { illicit: true, licit: true, unknown: true };
let selected = null;
const el = document.getElementById('g');
const status = document.getElementById('status');

const G = ForceGraph3D()(el)
  .backgroundColor(css('--surface-1'))
  .showNavInfo(false)
  .graphData({ nodes, links })
  .nodeVal('val')
  .nodeRelSize(3)
  .nodeColor(n => color[n.cls])
  .nodeOpacity(0.95)
  .nodeVisibility(n => visible[n.cls])
  .nodeLabel(n => `<b>tx ${n.tx}</b><br>${n.cls} · step ${n.step}<br>node index ${n.idx}<br>in ${n.in} · out ${n.out}`)
  .linkVisibility(l => visible[end(l.source).cls] && visible[end(l.target).cls])
  .linkColor(l => selected && (end(l.source) === selected || end(l.target) === selected) ? color.illicit : css('--edge'))
  .linkOpacity(0.5)
  .linkWidth(l => selected && (end(l.source) === selected || end(l.target) === selected) ? 1.6 : 0.5)
  .linkResolution(3)
  .linkDirectionalArrowLength(2.5)
  .linkDirectionalArrowRelPos(1)
  .onNodeClick(n => { selected = n; flyTo(n); G.nodeColor(G.nodeColor()); G.linkWidth(G.linkWidth()); })
  .onBackgroundClick(() => { selected = null; G.nodeColor(G.nodeColor()); G.linkWidth(G.linkWidth()); })
  .cooldownTicks(200)
  .onEngineTick(() => { status.textContent = 'laying out…'; })
  .onEngineStop(() => { status.textContent = `${nodes.length} nodes · ${links.length} edges · layout settled`; });

// dim nodes outside the selected neighbourhood
G.nodeColor(n => {
  if (!selected) return color[n.cls];
  return neighbours.get(selected.id).has(n.id) ? color[n.cls] : color[n.cls] + '33';
});
G.d3Force('charge').strength(-70);
G.d3Force('link').distance(20);

function flyTo(n) {
  const d = 60, r = Math.hypot(n.x, n.y, n.z) || 1;
  G.cameraPosition({ x: n.x * (1 + d / r), y: n.y * (1 + d / r), z: n.z * (1 + d / r) }, n, 800);
}

// legend
const legend = document.getElementById('legend');
for (const cls of ['illicit', 'licit', 'unknown']) {
  const n = nodes.filter(d => d.cls === cls).length;
  const lab = document.createElement('label');
  lab.innerHTML = `<input type="checkbox" checked> <span class="swatch ${cls}"></span> ${cls} (${n})`;
  lab.querySelector('input').addEventListener('change', e => {
    visible[cls] = e.target.checked;
    G.nodeVisibility(G.nodeVisibility()); G.linkVisibility(G.linkVisibility());
  });
  legend.appendChild(lab);
}

document.getElementById('search').addEventListener('change', e => {
  const n = byTx.get(Number(e.target.value.trim()));
  e.target.style.borderColor = n ? '' : color.illicit;
  if (n) { selected = n; flyTo(n); G.nodeColor(G.nodeColor()); G.linkWidth(G.linkWidth()); }
});
document.getElementById('reset').addEventListener('click', () => {
  selected = null; G.nodeColor(G.nodeColor()); G.linkWidth(G.linkWidth());
  G.zoomToFit(600, 20);
});
let spinning = false, angle = 0, spinTimer = null;
document.getElementById('spin').addEventListener('click', e => {
  spinning = !spinning;
  e.target.textContent = spinning ? 'Stop rotating' : 'Auto-rotate';
  clearInterval(spinTimer);
  if (spinning) spinTimer = setInterval(() => {
    const r = Math.hypot(G.cameraPosition().x, G.cameraPosition().z) || 300;
    angle += 0.006;
    G.cameraPosition({ x: r * Math.sin(angle), z: r * Math.cos(angle) });
  }, 16);
});

const fit = () => { const { width, height } = el.getBoundingClientRect(); G.width(width).height(height); };
window.addEventListener('resize', fit);
fit();
setTimeout(() => G.zoomToFit(800, 10), 3000);
</script>
</body>
</html>
